[project]
name = "constructor-backend"
version = "0.1.0"
description = "Backend конструктора ИИ-агентов: auth 1С, LLM/VLM, platform gateway"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.10.0",
    "pyodbc>=5.2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "platform-contracts",
    "platform-db",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "tools"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"
