<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Агент ожидает пользователя</title>
  <desc id="desc">Жёлто-оранжевая иконка агента, которой требуется внимание пользователя.</desc>

  <defs>
    <radialGradient id="body" cx="42%" cy="34%" r="72%">
      <stop offset="0" stop-color="#ffe68a"/>
      <stop offset="0.34" stop-color="#e8a926"/>
      <stop offset="0.72" stop-color="#895112"/>
      <stop offset="1" stop-color="#3a2108"/>
    </radialGradient>
    <linearGradient id="rim" x1="35" y1="32" x2="219" y2="221">
      <stop stop-color="#fff0a4"/>
      <stop offset="0.46" stop-color="#e8a928"/>
      <stop offset="1" stop-color="#6c3c0b"/>
    </linearGradient>
    <linearGradient id="screen" x1="90" y1="136" x2="167" y2="177">
      <stop stop-color="#4d310d"/>
      <stop offset="1" stop-color="#211606"/>
    </linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1d1002" flood-opacity=".55"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .agent { transform-origin:128px 128px; animation:hold 3s ease-in-out infinite; }
    .pulse-a,.pulse-b { transform-origin:128px 128px; animation:doublePulse 3s ease-out infinite; }
    .pulse-b { animation-delay:.23s; }
    .arc { animation:arcAlert 3s ease-in-out infinite; }
    .arc.two { animation-delay:.1s; }
    .arc.three { animation-delay:.2s; }
    .mark { transform-origin:128px 156px; animation:mark 3s ease-in-out infinite; }
    .status { animation:status 1.5s ease-in-out infinite; }

    @keyframes hold {
      0%,18%,32%,50%,100% { transform:scale(1); }
      9%,41% { transform:scale(1.025); }
    }
    @keyframes doublePulse {
      0% { opacity:.65; transform:scale(.9); }
      18% { opacity:0; transform:scale(1.12); }
      19%,31% { opacity:0; transform:scale(.94); }
      48% { opacity:0; transform:scale(1.12); }
      49%,100% { opacity:0; transform:scale(1.12); }
    }
    @keyframes arcAlert {
      0%,18%,32%,50%,100% { opacity:.28; }
      8%,40% { opacity:1; filter:url(#glow); }
    }
    @keyframes mark {
      0%,18%,32%,50%,100% { transform:translateY(0); }
      9%,41% { transform:translateY(-3px); }
    }
    @keyframes status { 0%,100% { opacity:.35; } 50% { opacity:1; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation:none !important; }
      .pulse-a,.pulse-b { opacity:0; }
    }
  </style>

  <circle class="pulse-a" cx="128" cy="128" r="107" fill="none" stroke="#ffc64b" stroke-width="7" filter="url(#glow)"/>
  <circle class="pulse-b" cx="128" cy="128" r="107" fill="none" stroke="#ff9f1c" stroke-width="4"/>

  <g class="agent" filter="url(#shadow)">
    <circle cx="128" cy="128" r="99" fill="url(#body)" stroke="#2a1807" stroke-width="7"/>
    <circle cx="128" cy="128" r="88" fill="none" stroke="url(#rim)" stroke-width="7"/>
    <path d="M58 91 A78 78 0 0 1 198 91" fill="none" stroke="#fff0a4" stroke-width="5" stroke-linecap="round" opacity=".3"/>

    <g fill="none" stroke="#ffe79a" stroke-linecap="round">
      <path class="arc one" d="M91 112 A44 44 0 0 1 165 112" stroke-width="7"/>
      <path class="arc two" d="M103 119 A31 31 0 0 1 153 119" stroke-width="7"/>
      <path class="arc three" d="M115 126 A17 17 0 0 1 141 126" stroke-width="7"/>
    </g>

    <rect x="78" y="126" width="100" height="61" rx="30.5" fill="#4a2e0c" stroke="#efb337" stroke-width="4"/>
    <rect x="88" y="136" width="80" height="41" rx="20.5" fill="url(#screen)"/>

    <g class="mark" fill="#ffe897" filter="url(#glow)">
      <rect x="124" y="143" width="8" height="20" rx="4"/>
      <circle cx="128" cy="170" r="4.5"/>
    </g>

    <circle class="status" cx="189" cy="183" r="16" fill="#ffb52e" stroke="#fff1aa" stroke-width="4"/>
    <path d="M189 174v10" stroke="#452704" stroke-width="4" stroke-linecap="round"/>
    <circle cx="189" cy="190" r="2.4" fill="#452704"/>
  </g>
</svg>
