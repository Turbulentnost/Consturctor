# Constructor Platform — full stack in Docker
# Usage:
#   cd infra
#   copy .env.example .env
#   docker compose up -d --build

x-platform-env: &platform-env
  DATABASE_URL: postgresql+psycopg://constructor:constructor@postgres:5432/constructor
  CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-rpc://}
  USE_STUBS: ${USE_STUBS:-false}

x-tool-urls: &tool-urls
  # IMAP/browser can run on Windows host to avoid Docker anti-bot / mail quirks:
  #   TOOL_IMAP_URL=http://host.docker.internal:7821
  #   TOOL_BROWSER_URL=http://host.docker.internal:7824
  TOOL_IMAP_URL: ${TOOL_IMAP_URL:-http://platform-tool-imap:7821}
  TOOL_ONEC_URL: ${TOOL_ONEC_URL:-http://platform-tool-onec:7822}
  TOOL_ONEC_COM_URL: ${TOOL_ONEC_COM_URL:-http://host.docker.internal:7831}
  TOOL_SHELL_URL: ${TOOL_SHELL_URL:-http://platform-tool-shell:7823}
  TOOL_SHELL_NATIVE_URL: ${TOOL_SHELL_NATIVE_URL:-http://host.docker.internal:7828}
  TOOL_BROWSER_URL: ${TOOL_BROWSER_URL:-http://platform-tool-browser:7824}
  TOOL_COM_URL: ${TOOL_COM_URL:-http://host.docker.internal:7826}
  TOOL_FS_URL: ${TOOL_FS_URL:-http://host.docker.internal:7827}
  TOOL_DESKTOP_HOST_URL: ${TOOL_DESKTOP_HOST_URL:-http://host.docker.internal:7830}
  TOOL_DESKTOP_LAUNCHER_URL: ${TOOL_DESKTOP_LAUNCHER_URL:-http://host.docker.internal:7829}
  KPI_SERVICE_URL: ${KPI_SERVICE_URL:-http://platform-kpi:7820}
  ORCHESTRATOR_URL: ${ORCHESTRATOR_URL:-http://platform-orchestrator-api:7825}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: constructor
      POSTGRES_PASSWORD: constructor
      POSTGRES_DB: constructor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U constructor -d constructor"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "${RABBITMQ_HOST_PORT:-5673}:5672"
      - "${RABBITMQ_MGMT_HOST_PORT:-15673}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  platform-kpi:
    build:
      context: ..
      dockerfile: services/platform-kpi/Dockerfile
    environment:
      <<: *platform-env
      API_PORT: "7820"
    ports:
      - "7820:7820"
    depends_on:
      postgres:
        condition: service_healthy

  platform-tool-imap:
    build:
      context: ..
      dockerfile: services/platform-tool-imap/Dockerfile
    environment:
      <<: *platform-env
      API_PORT: "7821"
      IMAP_HOST: ${IMAP_HOST:-imap.yandex.ru}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USERNAME: ${IMAP_USERNAME:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      IMAP_CONNECT_TIMEOUT_SEC: ${IMAP_CONNECT_TIMEOUT_SEC:-120}
    ports:
      - "7821:7821"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  platform-tool-imap-worker:
    build:
      context: ..
      dockerfile: services/platform-tool-imap/Dockerfile
    command: ["celery", "-A", "platform_tool_imap.celery_app", "worker", "-Q", "imap", "-l", "info"]
    restart: unless-stopped
    environment:
      <<: *platform-env
      IMAP_HOST: ${IMAP_HOST:-imap.yandex.ru}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USERNAME: ${IMAP_USERNAME:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      IMAP_CONNECT_TIMEOUT_SEC: ${IMAP_CONNECT_TIMEOUT_SEC:-120}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      platform-tool-imap:
        condition: service_started

  platform-tool-onec:
    build:
      context: ..
      dockerfile: services/platform-tool-onec/Dockerfile
    environment:
      <<: *platform-env
      API_PORT: "7822"
      ODATA_BASE_URL: ${ODATA_BASE_URL:-}
      ODATA_USERNAME: ${ODATA_USERNAME:-}
      ODATA_PASSWORD: ${ODATA_PASSWORD:-}
      ERP_LOGIN: ${ERP_LOGIN:-}
      ERP_PASSWORD: ${ERP_PASSWORD:-}
      ERP_SQL_SERVER: ${ERP_SQL_SERVER:-host.docker.internal}
      ERP_SQL_DATABASE: ${ERP_SQL_DATABASE:-erp_pm}
      ERP_SQL_DRIVER: ${ERP_SQL_DRIVER:-ODBC Driver 18 for SQL Server}
      ERP_SQL_TRUSTED_CONNECTION: ${ERP_SQL_TRUSTED_CONNECTION:-no}
      ERP_SQL_USER: ${ERP_SQL_USER:-}
      ERP_SQL_PASSWORD: ${ERP_SQL_PASSWORD:-}
      ODATA_INCOMING_DOC_ENTITY: ${ODATA_INCOMING_DOC_ENTITY:-Document_ТД_ВходящаяКорреспонденция}
      ODATA_TIMEOUT_SEC: ${ODATA_TIMEOUT_SEC:-120}
    ports:
      - "7822:7822"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  platform-tool-onec-worker:
    build:
      context: ..
      dockerfile: services/platform-tool-onec/Dockerfile
    command: ["celery", "-A", "platform_tool_onec.celery_app", "worker", "-Q", "onec", "-l", "info"]
    restart: unless-stopped
    environment:
      <<: *platform-env
      ODATA_BASE_URL: ${ODATA_BASE_URL:-}
      ODATA_USERNAME: ${ODATA_USERNAME:-}
      ODATA_PASSWORD: ${ODATA_PASSWORD:-}
      ERP_LOGIN: ${ERP_LOGIN:-}
      ERP_PASSWORD: ${ERP_PASSWORD:-}
      ERP_SQL_SERVER: ${ERP_SQL_SERVER:-host.docker.internal}
      ERP_SQL_DATABASE: ${ERP_SQL_DATABASE:-erp_pm}
      ERP_SQL_DRIVER: ${ERP_SQL_DRIVER:-ODBC Driver 18 for SQL Server}
      ERP_SQL_TRUSTED_CONNECTION: ${ERP_SQL_TRUSTED_CONNECTION:-no}
      ERP_SQL_USER: ${ERP_SQL_USER:-}
      ERP_SQL_PASSWORD: ${ERP_SQL_PASSWORD:-}
      ODATA_INCOMING_DOC_ENTITY: ${ODATA_INCOMING_DOC_ENTITY:-Document_ТД_ВходящаяКорреспонденция}
      ODATA_TIMEOUT_SEC: ${ODATA_TIMEOUT_SEC:-120}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      platform-tool-onec:
        condition: service_started

  platform-tool-shell:
    build:
      context: ..
      dockerfile: services/platform-tool-shell/Dockerfile
    environment:
      <<: *platform-env
      API_PORT: "7823"
    ports:
      - "7823:7823"
    depends_on:
      postgres:
        condition: service_healthy

  platform-tool-browser:
    build:
      context: ..
      dockerfile: services/platform-tool-browser/Dockerfile
    environment:
      <<: *platform-env
      API_PORT: "7824"
      URL_WHITELIST: localhost,127.0.0.1,example.com,www.example.com,turbo-don.ru,161.ru,ria.ru,don24.ru,donnews.ru,yandex.ru,ya.ru,google.com,duckduckgo.com,wikipedia.org,ru.wikipedia.org,en.wikipedia.org,calend.ru,www.calend.ru,vseinstrumenti.ru,rbc.ru,kommersant.ru,lenta.ru,gazeta.ru,mail.ru
    ports:
      - "7824:7824"
    depends_on:
      postgres:
        condition: service_healthy

  platform-orchestrator-api:
    build:
      context: ..
      dockerfile: services/platform-orchestrator/Dockerfile
    command: ["python", "-m", "platform_orchestrator.api_main"]
    environment:
      <<: [*platform-env, *tool-urls]
      API_PORT: "7825"
    ports:
      - "7825:7825"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      platform-tool-imap:
        condition: service_started
      platform-tool-onec:
        condition: service_started
      platform-tool-shell:
        condition: service_started
      platform-tool-browser:
        condition: service_started

  platform-orchestrator-worker:
    build:
      context: ..
      dockerfile: services/platform-orchestrator/Dockerfile
    command: ["celery", "-A", "platform_orchestrator.celery_app", "worker", "-Q", "default", "-l", "info"]
    restart: unless-stopped
    environment:
      <<: [*platform-env, *tool-urls]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      platform-orchestrator-api:
        condition: service_started

  platform-orchestrator-beat:
    build:
      context: ..
      dockerfile: services/platform-orchestrator/Dockerfile
    command: ["celery", "-A", "platform_orchestrator.celery_app", "beat", "-l", "info"]
    restart: unless-stopped
    environment:
      <<: [*platform-env, *tool-urls]
      IMAP_POLL_SECONDS: "60"
      ONEC_POLL_SECONDS: "120"
    depends_on:
      rabbitmq:
        condition: service_healthy
      platform-orchestrator-worker:
        condition: service_started

  constructor-gateway:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      <<: [*platform-env, *tool-urls]
      API_HOST: 0.0.0.0
      API_PORT: "7812"
      AUTH_STUB: ${AUTH_STUB:-false}
      DEV_MODE: ${DEV_MODE:-false}
      ALLOW_LOCAL_REGISTRATION: ${ALLOW_LOCAL_REGISTRATION:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-cursor}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CHAD_AI: ${CHAD_AI:-}
      CLAUDEHUB_MODEL: ${CLAUDEHUB_MODEL:-claude-sonnet-4.6}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      CURSOR_REGULATION_MODEL: ${CURSOR_REGULATION_MODEL:-composer-2.5}
      CURSOR_WORKFLOW_MODEL: ${CURSOR_WORKFLOW_MODEL:-composer-2.5}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-stub-key-32b}
      AUTH_SERVER_URL: ${AUTH_SERVER_URL:-}
      ERP_SQL_SERVER: ${ERP_SQL_SERVER:-ii1}
      ERP_SQL_DATABASE: ${ERP_SQL_DATABASE:-erp_pm}
      ERP_SQL_DRIVER: ${ERP_SQL_DRIVER:-ODBC Driver 18 for SQL Server}
      ERP_SQL_TRUSTED_CONNECTION: ${ERP_SQL_TRUSTED_CONNECTION:-no}
      ERP_SQL_USER: ${ERP_SQL_USER:-}
      ERP_SQL_PASSWORD: ${ERP_SQL_PASSWORD:-}
      ODATA_BASE_URL: ${ODATA_BASE_URL:-}
      ODATA_USERNAME: ${ODATA_USERNAME:-}
      ODATA_PASSWORD: ${ODATA_PASSWORD:-}
      ODATA_INCOMING_DOC_ENTITY: ${ODATA_INCOMING_DOC_ENTITY:-Document_ТД_ВходящаяКорреспонденция}
      ODATA_TIMEOUT_SEC: ${ODATA_TIMEOUT_SEC:-120}
      ERP_LOGIN: ${ERP_LOGIN:-}
      ERP_PASSWORD: ${ERP_PASSWORD:-}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USERNAME: ${IMAP_USERNAME:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      TOOL_ONEC_COM_URL: ${TOOL_ONEC_COM_URL:-http://host.docker.internal:7831}
      TOOL_MANIFEST_PATH: /app/backend/data/tool_manifest.json
    volumes:
      - ../backend/data/tool_manifest.json:/app/backend/data/tool_manifest.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7812:7812"
    depends_on:
      postgres:
        condition: service_healthy
      platform-kpi:
        condition: service_started
      platform-orchestrator-api:
        condition: service_started

  platform-demo-ui:
    build:
      context: ../platform-demo-ui
      dockerfile: Dockerfile
    environment:
      BIND_HOST: 0.0.0.0
      GATEWAY_URL: http://constructor-gateway:7812
      DOCKER_NETWORK: "1"
    ports:
      - "8790:8790"
    volumes:
      - ../platform-demo-ui:/app:ro
    depends_on:
      constructor-gateway:
        condition: service_started

volumes:
  pgdata:
