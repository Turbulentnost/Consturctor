[project]
name = "platform-contracts"
version = "0.1.0"
description = "Shared Pydantic contracts for Constructor platform services"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_contracts"]
