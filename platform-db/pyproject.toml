[project]
name = "platform-db"
version = "0.1.0"
description = "Shared SQLAlchemy models for Constructor platform PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_db"]
