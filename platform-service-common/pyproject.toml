[project]
name = "platform-service-common"
version = "0.1.0"
description = "Shared FastAPI helpers for Constructor platform tool services"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "platform-contracts",
    "platform-db",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_service_common"]

[tool.hatch.metadata]
allow-direct-references = true
