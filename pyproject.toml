[project]
name = "constructor-platform-tests"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "platform-contracts",
    "platform-tool-shell",
    "platform-tool-browser",
    "platform-kpi",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
