[project]
name = "platform-desktop-host"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "platform-contracts",
    "platform-db",
    "platform-service-common",
    "platform-tool-com",
    "platform-tool-filesystem",
    "platform-tool-shell",
    "platform-tool-imap",
    "platform-tool-browser",
    "imapclient>=3.0.1",
    "httpx>=0.27.0",
    "playwright>=1.49.0",
]

[project.optional-dependencies]
windows = ["pywin32>=306"]

[project.scripts]
platform-desktop-host = "platform_desktop_host.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_desktop_host"]

[tool.hatch.metadata]
allow-direct-references = true
