[project]
name = "platform-orchestrator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "celery>=5.4.0",
    "croniter>=2.0.0",
    "sqlalchemy>=2.0.36",
    "platform-contracts",
    "platform-db",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_orchestrator"]

[tool.hatch.metadata]
allow-direct-references = true
